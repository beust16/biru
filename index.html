<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{
    --night:#08050d;
    --night2:#110719;
    --night3:#1a0b24;

    --purple:#74479a;
    --purple2:#9c69bd;
    --lilac:#c69be3;
    --pink:#e795ca;
    --fuchsia:#d75aa8;

    --wine:#47152f;
    --wine2:#68234d;
    --wine3:#8c3269;

    --gold:#d8b96e;
    --gold2:#f0d99a;

    --silver:#d9d8e4;

    --paper:#f5eddd;
    --paper2:#e8dcc6;
    --paper3:#ded0b8;

    --ink:#2d1c27;
    --ink2:#54333f;

    --muted:#a99aaa;

    --shadow:rgba(0,0,0,.65);
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(169,91,205,.22),
            transparent 36%
        ),
        radial-gradient(
            circle at 5% 45%,
            rgba(122,35,101,.18),
            transparent 32%
        ),
        radial-gradient(
            circle at 95% 65%,
            rgba(85,43,144,.16),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #08050d 0%,
            #100719 45%,
            #07040c 100%
        );

    font-family:
        "Cormorant Garamond",
        serif;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-20;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:60px 60px;
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:9998;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 45%,
            rgba(0,0,0,.42) 100%
        );
}

/* =========================================================
   STARS
========================================================= */

#stars{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px rgba(255,255,255,.95),
        0 0 12px rgba(210,183,255,.5);

    animation:
        twinkle var(--duration)
        ease-in-out
        infinite
        alternate;
}

@keyframes twinkle{
    0%{
        opacity:.12;
        transform:scale(.65);
    }

    100%{
        opacity:1;
        transform:scale(1.35);
    }
}

/* =========================================================
   SNOW
========================================================= */

#snow{
    position:fixed;
    inset:0;
    z-index:40;
    pointer-events:none;
    overflow:hidden;
}

.flake{
    position:absolute;
    top:-35px;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 14px rgba(191,174,255,.55);

    opacity:var(--opacity);

    animation:
        snowFall
        var(--speed)
        linear
        infinite;
}

@keyframes snowFall{

    0%{
        transform:
            translate3d(0,-35px,0)
            rotate(0deg);
    }

    50%{
        transform:
            translate3d(var(--drift),55vh,0)
            rotate(180deg);
    }

    100%{
        transform:
            translate3d(
                calc(var(--drift) * -1),
                110vh,
                0
            )
            rotate(360deg);
    }
}

.snow-ground{
    position:fixed;
    left:-5%;
    right:-5%;
    bottom:-35px;

    height:100px;

    z-index:35;
    pointer-events:none;

    border-radius:
        50%
        50%
        0
        0;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(255,255,255,.98),
            rgba(233,229,246,.82) 42%,
            rgba(186,173,214,.2) 78%,
            transparent 100%
        );

    filter:blur(1px);

    opacity:.78;
}

/* =========================================================
   CHRISTMAS LIGHTS
========================================================= */

.christmas-lights{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:70px;

    z-index:50;
    pointer-events:none;
}

.wire{
    position:absolute;

    left:-3%;
    top:9px;

    width:106%;
    height:55px;

    border-top:
        2px solid
        rgba(28,19,31,.95);

    border-radius:50%;

    transform:rotate(1.4deg);
}

.bulb{
    position:absolute;

    width:13px;
    height:18px;

    top:32px;

    border-radius:
        50%
        50%
        45%
        45%;

    box-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor,
        0 0 35px currentColor;

    animation:
        bulbGlow
        1.6s
        ease-in-out
        infinite
        alternate;
}

.bulb:before{
    content:"";

    position:absolute;

    width:7px;
    height:5px;

    left:3px;
    top:-4px;

    border-radius:2px;

    background:#27212c;
}

.b1{
    left:4%;
    color:#e58acb;
}

.b2{
    left:12%;
    color:#d5c4ff;
    animation-delay:.2s;
}

.b3{
    left:20%;
    color:#f3ce78;
    animation-delay:.5s;
}

.b4{
    left:28%;
    color:#c58df3;
    animation-delay:.7s;
}

.b5{
    left:36%;
    color:#ef86bd;
    animation-delay:.1s;
}

.b6{
    left:44%;
    color:#f4d37d;
    animation-delay:.6s;
}

.b7{
    left:52%;
    color:#c89af8;
    animation-delay:.3s;
}

.b8{
    left:60%;
    color:#e98ccf;
    animation-delay:.8s;
}

.b9{
    left:68%;
    color:#ffe18c;
    animation-delay:.4s;
}

.b10{
    left:76%;
    color:#cba0fa;
    animation-delay:.1s;
}

.b11{
    left:84%;
    color:#eb8ac9;
    animation-delay:.6s;
}

.b12{
    left:92%;
    color:#f4d27c;
    animation-delay:.3s;
}

@keyframes bulbGlow{

    from{
        filter:brightness(.75);
    }

    to{
        filter:brightness(1.55);
    }
}

/* =========================================================
   LOCK SCREEN
========================================================= */

#lockScreen{
    position:fixed;
    inset:0;

    z-index:1000;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    background:
        radial-gradient(
            circle at center,
            rgba(115,59,145,.22),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07040b,
            #150a1d 55%,
            #07040b
        );

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#lockScreen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.lock-card{
    position:relative;

    width:min(450px,100%);

    padding:
        55px
        35px
        45px;

    text-align:center;

    border:
        1px solid
        rgba(215,183,109,.45);

    background:
        linear-gradient(
            145deg,
            rgba(67,28,66,.82),
            rgba(17,8,26,.95)
        );

    box-shadow:
        0 35px 110px rgba(0,0,0,.72),
        inset 0 0 60px rgba(217,137,205,.055);

    backdrop-filter:blur(18px);
}

.lock-card:before,
.lock-card:after{
    position:absolute;

    color:var(--gold);

    font-size:24px;

    opacity:.7;
}

.lock-card:before{
    content:"✦";

    top:18px;
    left:22px;
}

.lock-card:after{
    content:"✦";

    right:22px;
    bottom:18px;
}

.lock-icon{
    font-size:44px;
    margin-bottom:10px;

    filter:
        drop-shadow(
            0 0 13px
            rgba(235,179,245,.55)
        );
}

.lock-card h1{
    font-family:"Great Vibes",cursive;

    font-size:60px;

    font-weight:400;

    color:#f5d9ef;

    text-shadow:
        0 0 25px
        rgba(224,133,211,.4);
}

.lock-card p{
    margin:
        8px
        0
        27px;

    color:#c7b6c7;

    font-size:17px;
}

#passwordInput{
    width:100%;
    height:53px;

    padding:0 18px;

    border:
        1px solid
        rgba(216,182,110,.5);

    border-radius:5px;

    outline:none;

    color:white;

    text-align:center;

    letter-spacing:3px;

    font-family:inherit;
    font-size:17px;

    background:
        rgba(0,0,0,.28);
}

#passwordInput:focus{
    border-color:var(--pink);

    box-shadow:
        0 0 20px
        rgba(229,138,201,.2);
}

.unlock-btn{
    width:100%;

    height:51px;

    margin-top:14px;

    border:0;
    border-radius:5px;

    cursor:pointer;

    color:#261426;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:18px;
    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #e8c878,
            #f2dfa6
        );

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);

    transition:.3s;
}

.unlock-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 32px
        rgba(226,182,108,.28);
}

#errorMessage{
    min-height:22px;

    margin-top:10px;

    color:#f39ac7;

    font-size:15px;
}

/* =========================================================
   MAIN
========================================================= */

#mainContent{
    opacity:0;
    visibility:hidden;

    transition:
        opacity 1.2s ease;
}

#mainContent.show{
    opacity:1;
    visibility:visible;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    min-height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:
        120px
        20px
        100px;

    overflow:hidden;
}

.moon{
    position:absolute;

    width:245px;
    height:245px;

    right:8%;
    top:14%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 32%,
            rgba(255,255,255,.96),
            rgba(231,213,255,.85) 45%,
            rgba(168,129,198,.35) 70%,
            transparent 72%
        );

    opacity:.28;

    box-shadow:
        0 0 100px
        rgba(207,174,255,.2);
}

.moon:after{
    content:"";

    position:absolute;

    width:245px;
    height:245px;

    left:70px;
    top:-15px;

    border-radius:50%;

    background:#0b0611;
}

/* distant Christmas tree */

.distant-tree{
    position:absolute;

    left:4%;
    bottom:-30px;

    width:240px;
    height:330px;

    opacity:.35;

    filter:
        drop-shadow(
            0 0 30px
            rgba(155,101,191,.15)
        );
}

.tree-layer{
    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    border-left:
        solid transparent;

    border-right:
        solid transparent;

    border-bottom:
        solid #1a1024;
}

.tree1{
    bottom:15px;

    border-left-width:120px;
    border-right-width:120px;
    border-bottom-width:230px;
}

.tree2{
    bottom:75px;

    border-left-width:98px;
    border-right-width:98px;
    border-bottom-width:185px;
}

.tree3{
    bottom:140px;

    border-left-width:73px;
    border-right-width:73px;
    border-bottom-width:140px;
}

.tree-light{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#f6d57e;

    box-shadow:
        0 0 12px #f6d57e;

    animation:
        treeBlink
        2s
        ease-in-out
        infinite
        alternate;
}

.tree-light.t1{
    left:80px;
    bottom:147px;
}

.tree-light.t2{
    left:126px;
    bottom:115px;
    animation-delay:.4s;
}

.tree-light.t3{
    left:62px;
    bottom:84px;
    animation-delay:.8s;
}

.tree-light.t4{
    left:150px;
    bottom:62px;
    animation-delay:.2s;
}

.tree-light.t5{
    left:105px;
    bottom:39px;
    animation-delay:.6s;
}

@keyframes treeBlink{

    from{
        opacity:.35;
    }

    to{
        opacity:1;
        transform:scale(1.35);
    }
}

.hero-eyebrow{
    position:relative;
    z-index:2;

    color:#d7b8db;

    letter-spacing:5px;

    text-transform:uppercase;

    font-size:13px;

    margin-bottom:18px;
}

.hero h1{
    position:relative;
    z-index:2;

    font-family:"Great Vibes",cursive;

    font-size:
        clamp(
            75px,
            11vw,
            155px
        );

    font-weight:400;

    line-height:.9;

    color:#f2d9ed;

    text-shadow:
        0 0 18px
        rgba(232,140,211,.35),
        0 0 55px
        rgba(145,86,181,.3);
}

.hero h1 span{
    color:#e3b2df;
}

.hero-divider{
    position:relative;
    z-index:2;

    margin:
        30px
        0;

    color:var(--gold);

    letter-spacing:10px;
}

.hero-subtitle{
    position:relative;
    z-index:2;

    max-width:700px;

    margin-top:2px;

    color:#bcaabd;

    font-size:20px;

    line-height:1.7;
}

.counter{
    position:relative;
    z-index:2;

    display:flex;
    flex-wrap:wrap;

    justify-content:center;

    gap:11px;

    margin-top:30px;
}

.counter-box{
    min-width:92px;

    padding:
        13px
        17px;

    border:
        1px solid
        rgba(216,183,109,.3);

    background:
        rgba(39,16,47,.48);

    backdrop-filter:blur(8px);

    border-radius:4px;
}

.counter-box strong{
    display:block;

    font-size:28px;

    color:#eed7ec;

    font-weight:600;
}

.counter-box span{
    display:block;

    margin-top:2px;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#a997aa;
}

.newyear-counter{
    position:relative;
    z-index:2;

    margin-top:20px;

    color:#a99baa;

    font-size:14px;

    letter-spacing:2px;
}

.newyear-counter strong{
    color:#e3c98d;
}

.scroll-hint{
    position:absolute;

    bottom:28px;

    z-index:2;

    color:#9d8ca3;

    font-size:13px;

    letter-spacing:3px;

    text-transform:uppercase;

    animation:
        bounce
        2s
        infinite;
}

@keyframes bounce{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(8px);
    }
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
    position:relative;

    padding:
        110px
        20px;
}

.section-title{

/* =========================================================
   BOOK
========================================================= */

.book-wrap{
    width:min(1550px,100%);

    margin:auto;

    perspective:2200px;
}

.book{
    position:relative;

    width:100%;

    min-height:850px;

    padding:
        28px;

    border:
        8px solid
        #2b1025;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #311127,
            #5d1943 38%,
            #722250 55%,
            #321029
        );

    box-shadow:
        0 50px 100px rgba(0,0,0,.7),
        0 0 0 2px rgba(215,183,109,.3),
        inset 0 0 65px rgba(0,0,0,.5);
}

/* leather texture */

.book:before{
    content:"";

    position:absolute;
    inset:10px;

    border:
        1px solid
        rgba(226,191,111,.5);

    border-radius:8px;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            115deg,
            transparent 0,
            transparent 6px,
            rgba(255,255,255,.012) 7px,
            transparent 9px
        );
}

.book:after{
    content:"";

    position:absolute;

    top:0;
    bottom:0;
    left:57px;

    width:2px;

    background:
        linear-gradient(
            180deg,
            transparent,
            #c8a767,
            transparent
        );

    opacity:.45;
}

/* gold spine ornament */

.book-spine{
    position:absolute;

    left:22px;
    top:50%;

    width:25px;
    height:260px;

    transform:
        translateY(-50%);

    border:
        1px solid
        rgba(220,185,103,.35);

    border-radius:15px;

    pointer-events:none;
}

.book-spine:before,
.book-spine:after{
    content:"✦";

    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    color:#d8b96e;

    font-size:13px;
}

.book-spine:before{

/* =========================================================
   PAGE
========================================================= */

.page{
    position:relative;

    display:none;

    min-height:785px;

    overflow:hidden;

    border-radius:6px;

    padding:50px;

    background:
        radial-gradient(
            circle at 20% 15%,
            rgba(124,77,55,.09),
            transparent 20%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(104,63,49,.07),
            transparent 25%
        ),
        repeating-linear-gradient(
            0deg,
            rgba(80,50,35,.025) 0,
            rgba(80,50,35,.025) 1px,
            transparent 1px,
            transparent 4px
        ),
        linear-gradient(
            145deg,
            #f7efdf,
            #eadfc9
        );

    box-shadow:
        inset 0 0 55px
        rgba(74,46,31,.13),

        0 15px 30px
        rgba(0,0,0,.3);
}

.page.active{
    display:block;

    animation:
        pageIn
        .72s
        cubic-bezier(.18,.85,.2,1);
}

@keyframes pageIn{

    0%{
        opacity:0;
        transform:
            rotateY(-8deg)
            translateX(35px)
            scale(.985);
    }

    100%{
        opacity:1;
        transform:
            rotateY(0)
            translateX(0)
            scale(1);
    }
}

.page:before{
    content:"";

    position:absolute;

    inset:15px;

    border:
        1px solid
        rgba(90,54,38,.18);

    pointer-events:none;
}

.page:after{
    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:45px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(64,42,32,.06)
        );

    pointer-events:none;
}
